services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    restart: unless-stopped

  ml-api:
    build:
      context: ./ml-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ML_URL: /ml
    ports:
      - "8080:80"
    depends_on:
      - backend
      - ml-api
    restart: unless-stopped
